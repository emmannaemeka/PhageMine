name: External-tool integration

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - "environment.yml"
      - "tools/smoke_installed.py"
      - ".github/workflows/integration.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  conda-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - shell: micromamba-shell {0}
        run: python -m pip install ".[test]"
      - shell: micromamba-shell {0}
        run: phagemine doctor --json
      - shell: micromamba-shell {0}
        run: python -m pytest -q -m integration
        env:
          PHAGEMINE_REGISTRY_PATH: ${{ runner.temp }}/phagemine-integration-registry.json
      - shell: micromamba-shell {0}
        run: python tools/smoke_installed.py --external --input examples/demo_phage.fasta --output "${{ runner.temp }}/external-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-smoke
          path: ${{ runner.temp }}/external-smoke/installed_smoke_check.json
