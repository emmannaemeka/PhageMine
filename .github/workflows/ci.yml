name: PhageMine CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-14]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          - os: macos-15-intel
            python: "3.10"
          - os: macos-14
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
        env:
          PHAGEMINE_REGISTRY_PATH: ${{ runner.temp }}/phagemine-test-registry.json
      - run: python -m compileall -q src
      - run: python -m build
      - name: Install built wheel into a fresh environment
        run: |
          python -m venv "${{ runner.temp }}/phagemine-wheel"
          "${{ runner.temp }}/phagemine-wheel/bin/python" -m pip install dist/*.whl
          "${{ runner.temp }}/phagemine-wheel/bin/python" -m pip check
      - name: Execute installed package outside checkout
        run: |
          "${{ runner.temp }}/phagemine-wheel/bin/python" tools/smoke_installed.py --input examples/demo_phage.fasta --output "${{ runner.temp }}/installed-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-smoke-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/installed-smoke/installed_smoke_check.json

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[test,gui]"
      - run: python -m pytest -q tests/test_gui.py tests/test_gui_app.py
