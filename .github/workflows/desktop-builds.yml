name: Desktop release-candidate builds

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    tags: ["v1.1.0-rc.1"]
    paths:
      - "src/phagemine/**"
      - "tests/**"
      - "packaging/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-builds.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/phagemine/**"
      - "tests/**"
      - "packaging/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-builds.yml"

permissions:
  contents: read

jobs:
  macos-desktop:
    name: macOS ${{ matrix.label }} desktop build and smoke test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
            label: Apple Silicon
            artifact: AppleSilicon
          - runner: macos-15-intel
            architecture: x86_64
            label: Intel
            artifact: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and desktop dependencies
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          python -m pip install -c packaging/macos-desktop-constraints.txt -e ".[desktop]" pytest
          python -m pip check
      - name: Resolve authoritative release-candidate version
        run: |
          echo "PHAGEMINE_VERSION=$(python -c 'from phagemine import __version__; print(__version__)')" >> "$GITHUB_ENV"
          test "$(python -c 'from phagemine import release_tag; print(release_tag())')" = "v1.1.0-rc.1"
      - name: Run GUI tests
        run: PYTHONPATH=src pytest -q tests/test_gui.py
      - name: Run full unit suite
        run: PYTHONPATH=src pytest -q
      - name: Build PhageMine.app
        run: python scripts/build_desktop.py
      - name: Verify packaged application metadata
        run: |
          test "$(defaults read "$PWD/dist/PhageMine.app/Contents/Info" CFBundleShortVersionString)" = "$PHAGEMINE_VERSION"
          dist/PhageMine.app/Contents/MacOS/PhageMine --phagemine-cli --version | grep -Fx "$PHAGEMINE_VERSION"
      - name: Audit packaged architecture and deployment target
        run: |
          test "$(uname -m)" = "${{ matrix.architecture }}"
          if [ "${{ matrix.architecture }}" = "x86_64" ]; then
            python scripts/audit_macos_bundle.py dist/PhageMine.app --architecture x86_64 --maximum-minimum-macos 12.0
          else
            python scripts/audit_macos_bundle.py dist/PhageMine.app --architecture arm64
          fi
      - name: Smoke-test packaged core annotation
        run: python scripts/smoke_packaged_analysis.py dist/PhageMine.app/Contents/MacOS/PhageMine examples/demo_phage.fasta
      - name: Smoke-test packaged local interface
        run: |
          dist/PhageMine.app/Contents/MacOS/PhageMine --no-browser --server.port=8765 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          python scripts/wait_for_health.py http://127.0.0.1:8765/_stcore/health
      - name: Create DMG
        run: hdiutil create -volname PhageMine -srcfolder dist/PhageMine.app -ov -format UDZO "PhageMine-macOS-${{ matrix.artifact }}-${PHAGEMINE_VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: PhageMine-macOS-${{ matrix.artifact }}-${{ env.PHAGEMINE_VERSION }}
          path: PhageMine-macOS-${{ matrix.artifact }}-${{ env.PHAGEMINE_VERSION }}.dmg
          if-no-files-found: error

  windows-desktop:
    name: Windows desktop build and smoke test
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test and desktop dependencies
        run: python -m pip install -e ".[desktop]" pytest
      - name: Resolve authoritative release-candidate version
        shell: pwsh
        run: |
          $version = python -c "from phagemine import __version__; print(__version__)"
          $tag = python -c "from phagemine import release_tag; print(release_tag())"
          if ($tag -ne "v1.1.0-rc.1") { throw "Unexpected release tag: $tag" }
          "PHAGEMINE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run GUI tests
        run: $env:PYTHONPATH="src"; pytest -q tests/test_gui.py
      - name: Run full unit suite
        run: $env:PYTHONPATH="src"; pytest -q
      - name: Build windowless desktop application
        run: python scripts/build_desktop.py
      - name: Verify packaged application metadata
        shell: pwsh
        run: |
          $productVersion = (Get-Item "dist\PhageMine\PhageMine.exe").VersionInfo.ProductVersion
          if ($productVersion -ne $env:PHAGEMINE_VERSION) { throw "Executable version $productVersion does not match $env:PHAGEMINE_VERSION" }
          $versionProcess = Start-Process -FilePath "dist\PhageMine\PhageMine.exe" -ArgumentList "--phagemine-cli-output", "cli-version.txt", "--phagemine-cli", "--version" -Wait -PassThru
          if ($versionProcess.ExitCode -ne 0) { throw "Frozen CLI version check failed with exit code $($versionProcess.ExitCode)" }
          $reported = (Get-Content cli-version.txt -Raw).Trim()
          if ($reported -ne $env:PHAGEMINE_VERSION) { throw "CLI version $reported does not match $env:PHAGEMINE_VERSION" }
      - name: Verify Windows core backend remains fail-closed
        shell: pwsh
        run: |
          $doctorProcess = Start-Process -FilePath "dist\PhageMine\PhageMine.exe" -ArgumentList "--phagemine-cli-output", "doctor.json", "--phagemine-cli", "doctor", "--json" -Wait -PassThru
          if ($doctorProcess.ExitCode -ne 0) { throw "Frozen doctor failed with exit code $($doctorProcess.ExitCode)" }
          $doctor = (Get-Content doctor.json -Raw | ConvertFrom-Json)
          if ($doctor.capabilities.CORE_ANALYSIS -eq "READY") { throw "Windows core analysis must not be READY without a validated PHANOTATE backend" }
      - name: Smoke-test packaged CLI output pipeline (technical preview)
        run: python scripts/smoke_packaged_analysis.py "dist\PhageMine\PhageMine.exe" examples\demo_phage.fasta --demo
      - name: Smoke-test packaged local interface
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\PhageMine\PhageMine.exe" -ArgumentList "--no-browser", "--server.port=8765" -PassThru
          $response = $null
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              try { $response = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/_stcore/health -TimeoutSec 1 } catch { Start-Sleep -Milliseconds 500 }
            } until (($null -ne $response -and $response.StatusCode -eq 200) -or (Get-Date) -gt $deadline)
            if ($null -eq $response -or $response.StatusCode -ne 200) { throw "Packaged GUI health endpoint did not become ready" }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${env:PHAGEMINE_VERSION}" packaging\PhageMine.iss
          $installerDescription = (Get-Item "installer-dist\PhageMine-Windows-Setup.exe").VersionInfo.FileDescription
          if ($installerDescription -ne "PhageMine Desktop ${env:PHAGEMINE_VERSION} installer") { throw "Installer metadata version mismatch: $installerDescription" }
      - uses: actions/upload-artifact@v4
        with:
          name: PhageMine-Windows-${{ env.PHAGEMINE_VERSION }}-${{ github.run_number }}-${{ github.sha }}
          path: installer-dist/PhageMine-Windows-Setup.exe
          if-no-files-found: error
