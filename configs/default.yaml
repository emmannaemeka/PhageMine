# This MVP intentionally defaults to deterministic mock evidence. It is not biological annotation.
gene_prediction:
  predictor: phanotate
  # PHANOTATE is an external phage-oriented gene caller. Demo ORF calling is fixture-only.
evidence:
  backend: optional
  pfam:
    path: null
    hmmscan: null
    evalue_threshold: null
    coverage_threshold: null
    trusted_cutoff: false
    threshold_mode: none
  vogdb:
    path: null
    annotations: null
    evalue_threshold: 1.0e-5
    coverage_threshold: 0.5
  swissprot:
    path: null
    metadata: null
    diamond: null
    evalue_threshold: 1.0e-5
  phrogs:
    path: null
    annotations: null
    mmseqs: null
    evalue_threshold: 1.0e-5
    coverage_threshold: 0.5
    score_threshold: null
    identity_threshold: null
    alignment_length_threshold: null
scoring:
  high_interest: 70
  moderate_interest: 45
