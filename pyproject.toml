[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phagemine"
version = "1.0.2"
description = "Evidence-first phage annotation and discovery mining"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["streamlit>=1.36,<2"]

[project.scripts]
phagemine = "phagemine.cli:main"
phagemine-gui = "phagemine.gui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: exercises external tools or registered biological resources",
    "slow: long-running resource-backed integration test",
]
