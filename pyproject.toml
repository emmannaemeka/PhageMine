[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phagemine"
version = "1.2.0"
description = "Evidence-first phage annotation and discovery mining"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "Nnaemeka Emmanuel Nnadi"}]
keywords = ["bacteriophage", "genome annotation", "bioinformatics", "phage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "matplotlib>=3.7,<4",
    "pyhmmer>=0.10,<0.13",
    # These providers are invoked automatically for fresh genome analyses.
    "pyrodigal==3.7.1",
    "pyrodigal-gv==0.3.2",
    "pyrodigal-rv==0.1.0",
]

[project.urls]
Homepage = "https://github.com/emmannaemeka/PhageMine"
Repository = "https://github.com/emmannaemeka/PhageMine"
Issues = "https://github.com/emmannaemeka/PhageMine/issues"

[project.optional-dependencies]
gui = ["streamlit>=1.36,<2"]
test = [
    "biopython>=1.85,<2",
    "build>=1,<2",
    "pytest>=8,<10",
    "tomli; python_version < '3.11'",
]

[project.scripts]
phagemine = "phagemine.cli:main"
phagemine-gui = "phagemine.gui.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: exercises external tools or registered biological resources",
    "slow: long-running resource-backed integration test",
]
