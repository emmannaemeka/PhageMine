[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phagemine"
dynamic = ["version"]
description = "Evidence-first phage annotation and discovery mining"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["streamlit>=1.36,<2"]
desktop = [
    "streamlit>=1.36,<2",
    "pillow>=10,<12",
    "pyinstaller>=6.10,<7",
    "phanotate==1.6.7; sys_platform != 'win32'",
    # PHANOTATE 1.6.7 imports pkg_resources at runtime. Setuptools 81 removed it.
    "setuptools>=68,<81; sys_platform != 'win32'",
]

[project.scripts]
phagemine = "phagemine.cli:main"
phagemine-gui = "phagemine.gui.launcher:main"
phagemine-desktop = "phagemine.gui.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "phagemine.__version__"}

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: exercises external tools or registered biological resources",
    "slow: long-running resource-backed integration test",
]
