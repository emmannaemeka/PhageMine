[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phagemine"
version = "0.1.0"
description = "Evidence-first phage annotation and discovery-mining prototype"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
phagemine = "phagemine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
