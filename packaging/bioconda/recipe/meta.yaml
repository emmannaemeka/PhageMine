{% set version = "1.3.0.dev0" %}

package:
  name: phagemine
  version: {{ version }}

# Development recipe: build from this reviewed checkout. A public submission
# must replace path with the release archive URL and its actual SHA256.
source:
  path: ../../..

build:
  number: 0
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - phagemine = phagemine.cli:main
    - phagemine-gui = phagemine.gui.launcher:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68,<81
    - wheel
  run:
    - python >=3.10
    - setuptools <81
    - biopython >=1.85,<2
    - psutil >=5,<8
    - matplotlib-base >=3.7,<4
    - pyhmmer >=0.10,<0.13
    - pyrodigal =3.7.1
    - pyrodigal-gv =0.3.2
    - pyrodigal-rv =0.1.0
    - phanotate =1.6.7
    - prodigal =2.6.3
    - hmmer =3.4
    - mmseqs2
    - diamond
    - mash =2.3
    - blast
    - trnascan-se =2.0.12

test:
  imports:
    - phagemine
    - phagemine.rna_features
    - phagemine.curation
  commands:
    - phagemine --version
    - phagemine rna --help
    - phagemine curate --help

about:
  home: https://github.com/emmannaemeka/PhageMine
  license: MIT
  license_file: LICENSE
  summary: Evidence-first phage annotation with RNA coverage and audited curation

extra:
  recipe-maintainers:
    - emmannaemeka
